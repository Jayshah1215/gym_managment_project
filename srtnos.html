<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCFS Page Simulator</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }
    .memory {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }
    .page {
        width: 50px;
        height: 50px;
        border: 1px solid #000;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 5px;
        font-size: 16px;
    }
    .frame {
        width: 50px;
        height: 50px;
        border: 1px solid #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 16px;
    }
    .hit {
        background-color: #007bff;
        color: #fff;
    }
    .miss {
        background-color: #dc3545;
        color: #fff;
    }
</style>
</head>
<body>
    <h2>FCFS Page Simulator</h2>
    <div class="memory" id="memory">
        <!-- Memory frames will be dynamically added here -->
    </div>
    <button onclick="runFCFS()">Run FCFS</button>

    <script>
        // Number of memory frames
        const numFrames = 3;

        // Page reference string
        const pageReferenceString = [3, 1, 4, 1, 2, 1, 3, 5, 2, 4];

        function runFCFS() {
            const memoryContainer = document.getElementById('memory');
            memoryContainer.innerHTML = '';

            const memoryFrames = [];
            let pageFaults = 0;

            for (let i = 0; i < pageReferenceString.length; i++) {
                const page = pageReferenceString[i];
                let pageExists = false;

                // Check if page is already in memory
                for (let j = 0; j < memoryFrames.length; j++) {
                    if (memoryFrames[j] === page) {
                        pageExists = true;
                        break;
                    }
                }

                // If page is not in memory, replace a page or add it to memory
                if (!pageExists) {
                    if (memoryFrames.length < numFrames) {
                        memoryFrames.push(page);
                    } else {
                        memoryFrames.shift();
                        memoryFrames.push(page);
                    }
                    pageFaults++;
                }

                // Display memory frames
                displayMemory(memoryContainer, memoryFrames, page, pageExists);
            }

            // Display page faults
            const pageFaultDiv = document.createElement('div');
            pageFaultDiv.textContent = `Page faults: ${pageFaults}`;
            memoryContainer.appendChild(pageFaultDiv);
        }

        function displayMemory(container, frames, page, hit) {
            frames.forEach(frame => {
                const div = document.createElement('div');
                div.classList.add('frame');
                if (frame === page && hit) {
                    div.classList.add('hit');
                } else if (frame === page && !hit) {
                    div.classList.add('miss');
                }
                div.textContent = frame;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
