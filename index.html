<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFO Page Replacement Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>FIFO Page Replacement Simulation</h1>
        <label for="frameSize" style="margin-right: 115px;">Frame Size:</label>
        <input type="number" id="frameSize" min="1" required>
        <br>
        <label for="pages">Pages (comma-separated):</label>
        <input type="text" id="pages" required>
        <br>
        <button onclick="simulateFIFO()">Simulate</button>

        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
