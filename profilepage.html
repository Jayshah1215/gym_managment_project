      <header class="header-area header-sticky">
        <div class="container">

  <div class="wrapper">
    <div class="profile">
      <div class="content">
        <h1>Edit Profile</h1>
        <form action="gymmanagment.html">
          <!-- Photo -->
          <fieldset>
            <div class="grid-35">
              <label for="avatar">Your Photo</label>
            </div>
            <div class="grid-65">
              <span class="photo" title="Upload your Avatar!"></span>
              <input type="file" class="btn" />
            </div>
          </fieldset>
          <fieldset>
            <div class="grid-35">
              <label for="fname">First Name</label>
            </div>
            <div class="grid-65">
              <input type="text" id="fname" tabindex="1" />
            </div>
          </fieldset>
          <fieldset>
            <div class="grid-35">
              <label for="lname">Last Name</label>
            </div>
            <div class="grid-65">
              <input type="text" id="lname" tabindex="2" />
            </div>
          </fieldset>
          <!-- Description about User -->
          <fieldset>
            <div class="grid-35">
              Gender
            </div>
            <div class="grid-65">
              <select>
                <option name="gender" value="male">Male</option>
                <option name="gender" value="female">Female</option> 
              </select>
            </div>
          </fieldset>
          <!-- Location -->
          <fieldset>
            <div class="grid-35">
              <label for="location">Weight</label>
            </div>
            <div class="grid-65">
              <input type="text" id="location" tabindex="4" />
            </div>
          </fieldset>
          <!-- height -->
          <fieldset>
            <div class="grid-35">
              <label for="height">Height</label>
            </div>
            <div class="grid-65">
              <input type="number" id="height" tabindex="5" />
            </div>
          </fieldset>
          <!-- Email -->
          <fieldset>
            <div class="grid-35">
              <label for="email">Email Address</label>
            </div>
            <div class="grid-65">
              <input type="email" id="email" tabindex="6" />
            </div>
          </fieldset>
          <fieldset>
            <input type="button" class="Btn cancel" value="Cancel" />
            <input type="submit" class="Btn" value="Save Changes" />
          </fieldset>
  
        </form>
      </div>
    </div>
  </div>
